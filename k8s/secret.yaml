apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  # For PostgreSQL container
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "secret_password"
  POSTGRES_DB: "messages"
  # For Node.js application
  DB_USER: "postgres"
  DB_PASSWORD: "secret_password"
  DB_NAME: "messages"
