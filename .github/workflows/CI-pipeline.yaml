name: Enhanced CI Pipeline
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to build'
        required: true
        type: choice
        options:
        - frontend
        - backend
        - database
      tag:
        description: 'Tag for the image (default: auto-generated)'
        required: false
        default: 'auto'
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
        - development
        - staging
        - production
        default: 'development'

env:
  REGISTRY: docker.io
  NODE_VERSION: '18'

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    
    outputs:
      image-name: ${{ steps.build-info.outputs.image-name }}
      image-tag: ${{ steps.build-info.outputs.image-tag }}
      service-type: ${{ steps.service-info.outputs.service-type }}
    
    steps:
      # =====================================================
      # STEP 1: SETUP & PREPARATION
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better tagging
      
      - name: Determine service type and configuration
        id: service-info
        run: |
          SERVICE=${{ github.event.inputs.service }}
          
          case $SERVICE in
            "frontend")
              echo "service-type=react" >> $GITHUB_OUTPUT
              echo "package-manager=npm" >> $GITHUB_OUTPUT
              ;;
            "backend")
              echo "service-type=nodejs" >> $GITHUB_OUTPUT
              echo "package-manager=npm" >> $GITHUB_OUTPUT
              ;;
            "database")
              echo "service-type=database" >> $GITHUB_OUTPUT
              echo "package-manager=none" >> $GITHUB_OUTPUT
              ;;
          esac
          
          echo "Selected service: $SERVICE (type: $(cat $GITHUB_OUTPUT | grep service-type | cut -d'=' -f2 || echo 'unknown'))"
      
      - name: Generate build information
        id: build-info
        run: |
          SERVICE=${{ github.event.inputs.service }}
          USERNAME=${{ secrets.DOCKER_USERNAME }}
          
          # Generate tag
          if [ "${{ github.event.inputs.tag }}" = "auto" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=$(git rev-parse --short HEAD)
            BRANCH=$(git rev-parse --abbrev-ref HEAD | sed 's/[^a-zA-Z0-9]/-/g')
            TAG="${BRANCH}-${SHORT_SHA}-${TIMESTAMP}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          
          IMAGE_NAME="${USERNAME}/${SERVICE}"
          FULL_IMAGE="${IMAGE_NAME}:${TAG}"
          
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image-tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full-image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          
          echo "🏗️ Building: ${FULL_IMAGE}"
          echo "📝 Environment: ${{ github.event.inputs.environment }}"

      # =====================================================
      # STEP 2: SOURCE CODE SECURITY SCANNING (SIMPLIFIED FOR POC)
      # =====================================================
      - name: Basic Secret Scanning (Simple grep)
        if: steps.service-info.outputs.service-type != 'database'
        run: |
          echo "🔍 Running basic secret detection..."
          # Simple pattern matching for common secrets
          if grep -r -E "(password|secret|key|token).*(=|:)" ${{ github.event.inputs.service }}/ --include="*.js" --include="*.json" --include="*.env*" || true; then
            echo "⚠️ Potential secrets found - review manually"
          else
            echo "✅ No obvious secrets detected"
          fi
        continue-on-error: true

      # Skip CodeQL for POC - can be added later
      # - name: Run CodeQL Analysis (SAST)
      #   uses: github/codeql-action/init@v3
      #   if: steps.service-info.outputs.service-type != 'database'
      #   with:
      #     languages: javascript
      #   continue-on-error: true

      # =====================================================
      # STEP 3: DEPENDENCY SCANNING & SETUP (POC SIMPLIFIED)
      # =====================================================
      - name: Setup Node.js (Simplified for POC)
        if: steps.service-info.outputs.package-manager == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Removed cache for POC - can add back later when structure is confirmed

      - name: Check service structure
        if: steps.service-info.outputs.package-manager == 'npm'
        run: |
          echo "📁 Checking service directory structure..."
          ls -la ${{ github.event.inputs.service }}/
          
          if [ -f "${{ github.event.inputs.service }}/package.json" ]; then
            echo "✅ package.json found"
            cat ${{ github.event.inputs.service }}/package.json | head -20
          else
            echo "❌ package.json not found"
            exit 1
          fi

      - name: Install dependencies (Production only for POC)
        if: steps.service-info.outputs.package-manager == 'npm'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "📦 Installing dependencies for ${{ github.event.inputs.service }}"
          if [ -f "package-lock.json" ]; then
            npm ci --only=production --ignore-scripts
          else
            npm install --only=production --ignore-scripts
          fi

      - name: Basic dependency check (Simplified for POC)
        if: steps.service-info.outputs.package-manager == 'npm'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "🔍 Basic dependency check..."
          npm ls --depth=0 > ../dependency-report.txt || echo "⚠️ Some dependency issues found"
          
          # Skip npm audit for POC to avoid blocking builds
          echo "ℹ️ Skipping npm audit for POC"

      # =====================================================
      # STEP 4: CODE QUALITY & TESTING (POC - Optional)
      # =====================================================
      - name: Install dev dependencies (if needed)
        if: steps.service-info.outputs.package-manager == 'npm'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "📦 Installing all dependencies for testing..."
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Check available scripts
        if: steps.service-info.outputs.package-manager == 'npm'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "📋 Available npm scripts:"
          npm run || echo "No scripts section found"

      - name: Run Linting (if available)
        if: steps.service-info.outputs.package-manager == 'npm'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "🔧 Checking for lint script..."
          if npm run | grep -q "lint"; then
            echo "Running linter..."
            npm run lint || echo "⚠️ Linting failed - continuing anyway for POC"
          else
            echo "ℹ️ No lint script found - skipping"
          fi
        continue-on-error: true

      - name: Run Tests (if available) - Frontend
        if: steps.service-info.outputs.service-type == 'react'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "🧪 Checking for test script..."
          if npm run | grep -q "test"; then
            echo "Running React tests..."
            CI=true npm test -- --coverage --watchAll=false || echo "⚠️ Tests failed - continuing anyway for POC"
          else
            echo "ℹ️ No test script found - skipping"
          fi
        continue-on-error: true

      - name: Run Tests (if available) - Backend
        if: steps.service-info.outputs.service-type == 'nodejs'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "🧪 Checking for test script..."
          if npm run | grep -q "test"; then
            echo "Running Node.js tests..."
            npm test || echo "⚠️ Tests failed - continuing anyway for POC"
          else
            echo "ℹ️ No test script found - skipping"
          fi
        continue-on-error: true

      - name: Upload test coverage (if exists)
        if: steps.service-info.outputs.package-manager == 'npm'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.event.inputs.service }}
          path: ${{ github.event.inputs.service }}/coverage/
          retention-days: 7
        continue-on-error: true

      # =====================================================
      # STEP 5: BUILD APPLICATION (POC - Flexible)
      # =====================================================
      - name: Build Application (if build script exists)
        if: steps.service-info.outputs.package-manager == 'npm'
        working-directory: ${{ github.event.inputs.service }}
        run: |
          echo "🔨 Checking for build script..."
          if npm run | grep -q "build"; then
            echo "Building ${{ steps.service-info.outputs.service-type }} application..."
            npm run build || echo "⚠️ Build failed - continuing anyway for POC"
          else
            echo "ℹ️ No build script found - skipping (Docker will handle build)"
          fi
        continue-on-error: true

      # =====================================================
      # STEP 6: DOCKER BUILD & SECURITY SCAN
      # =====================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ${{ github.event.inputs.service }}
        run: |
          SERVICE=${{ github.event.inputs.service }}
          FULL_IMAGE=${{ steps.build-info.outputs.full-image }}
          
          echo "🐳 Building Docker image: $FULL_IMAGE"
          
          # Build with cache optimization
          docker build \
            --tag $FULL_IMAGE \
            --label "service=$SERVICE" \
            --label "environment=${{ github.event.inputs.environment }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "git-commit=$(git rev-parse HEAD)" \
            --label "git-branch=$(git rev-parse --abbrev-ref HEAD)" \
            .
          
          echo "✅ Docker image built successfully"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-info.outputs.full-image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate image size report
        run: |
          IMAGE_SIZE=$(docker images ${{ steps.build-info.outputs.full-image }} --format "{{.Size}}")
          echo "📊 Image size: $IMAGE_SIZE"
          echo "IMAGE_SIZE=$IMAGE_SIZE" >> $GITHUB_ENV

      # =====================================================
      # STEP 7: PUSH TO REGISTRY
      # =====================================================
      - name: Push Docker image
        run: |
          FULL_IMAGE=${{ steps.build-info.outputs.full-image }}
          
          echo "⬆️ Pushing image to registry..."
          docker push $FULL_IMAGE
          
          # Also tag as latest for development environment
          if [ "${{ github.event.inputs.environment }}" = "development" ]; then
            docker tag $FULL_IMAGE ${{ steps.build-info.outputs.image-name }}:latest
            docker push ${{ steps.build-info.outputs.image-name }}:latest
            echo "✅ Also tagged as 'latest'"
          fi
          
          echo "✅ Successfully pushed $FULL_IMAGE"

      # =====================================================
      # STEP 8: BUILD ARTIFACTS & REPORTING
      # =====================================================
      - name: Generate build manifest
        run: |
          cat > build-manifest.json << EOF
          {
            "service": "${{ github.event.inputs.service }}",
            "serviceType": "${{ steps.service-info.outputs.service-type }}",
            "image": "${{ steps.build-info.outputs.full-image }}",
            "tag": "${{ steps.build-info.outputs.image-tag }}",
            "environment": "${{ github.event.inputs.environment }}",
            "buildDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "gitCommit": "$(git rev-parse HEAD)",
            "gitBranch": "$(git rev-parse --abbrev-ref HEAD)",
            "imageSize": "${{ env.IMAGE_SIZE }}",
            "buildDuration": "${{ job.duration }}",
            "nodeVersion": "${{ env.NODE_VERSION }}"
          }
          EOF
          
          echo "📋 Build manifest created"
          cat build-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.event.inputs.service }}-${{ steps.build-info.outputs.image-tag }}
          path: |
            build-manifest.json
            dependency-report.txt
            trivy-results.sarif
          retention-days: 30

      # =====================================================
      # STEP 9: NOTIFICATIONS & SUMMARY (POC - Simplified)
      # =====================================================
      - name: Build Summary
        run: |
          echo "## 🚀 CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ github.event.inputs.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ steps.service-info.outputs.service-type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.build-info.outputs.full-image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ env.IMAGE_SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $(git rev-parse --short HEAD) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Registry Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.build-info.outputs.full-image }}" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/${{ github.event.inputs.service }} ${{ github.event.inputs.service }}=${{ steps.build-info.outputs.full-image }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Slack notification removed for POC - can be added later
      # - name: Slack Notification
      #   if: always()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     channel: '#deployments'
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   continue-on-error: true
