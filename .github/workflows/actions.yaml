name: Simple Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to build'
        required: true
        type: choice
        options:
        - frontend
        - backend
        - database
      tag:
        description: 'Tag for the image (default: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        run: |
          # Simple variables
          SERVICE=${{ github.event.inputs.service }}
          TAG=${{ github.event.inputs.tag }}
          USERNAME=${{ secrets.DOCKER_USERNAME }}
          
          # Print info
          echo "Building service: $SERVICE"
          echo "Image tag: $TAG"
          
          # Basic Docker build & push
          cd $SERVICE
          docker build -t $USERNAME/$SERVICE:$TAG .
          docker push $USERNAME/$SERVICE:$TAG