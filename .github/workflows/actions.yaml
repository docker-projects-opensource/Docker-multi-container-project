name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      push_latest:
        description: 'Tag as latest'
        required: true
        type: boolean
        default: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, database]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Prepare Tags
        id: prep
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}
          VERSION_TAG=${DOCKER_IMAGE}:${{ github.event.inputs.version }}-${{ github.event.inputs.environment }}
          SHA_TAG=${DOCKER_IMAGE}:sha-${GITHUB_SHA::8}
          
          TAGS="${VERSION_TAG},${SHA_TAG}"
          
          if [[ "${{ github.event.inputs.push_latest }}" == "true" ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${{ github.event.inputs.version }}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            COMMIT_SHA=${{ github.sha }}