name: Simple Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to build'
        required: true
        type: choice
        options:
        - frontend
        - backend
        - database
      image_name:
        description: 'Docker image name (e.g., myusername/frontend)'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'
        type: string

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Print build information
        run: |
          echo "Building service: ${{ github.event.inputs.service }}"
          echo "Image name: ${{ github.event.inputs.image_name }}"
          echo "Image tag: ${{ github.event.inputs.image_tag }}"
          
      - name: Build and push Docker image
        run: |
          cd ${{ github.event.inputs.service }}
          docker build -t ${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }} .
          docker push ${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}