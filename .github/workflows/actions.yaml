name: Simple Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to build'
        required: true
        type: choice
        options:
        - frontend
        - backend
        - database
      image_tag:
        description: 'Docker image tag (e.g., latest, v1.0)'
        required: true
        default: 'latest'
        type: string
     

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Print build information
        run: |
          echo "Building service: ${{ github.event.inputs.service }}"
          echo "Image name: ${{ github.event.inputs.image_name }}"
          echo "Image tag: ${{ github.event.inputs.image_tag }}"
          
      - name: Build and push Docker image
        run: |
          # Ensure we're using the correct repository format with username
          cd ${{ github.event.inputs.service }}
          # Explicitly use the Docker Hub username from secrets to ensure proper namespace
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}"
          echo "Building image: $IMAGE_NAME:${{ github.event.inputs.image_tag }}"
          
          # Build and push with proper namespace
          docker build -t $IMAGE_NAME:${{ github.event.inputs.image_tag }} .
          docker push $IMAGE_NAME:${{ github.event.inputs.image_tag }}