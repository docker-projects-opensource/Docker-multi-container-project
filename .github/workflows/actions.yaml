name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      push_latest:
        description: 'Tag as latest'
        required: true
        type: boolean
        default: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.event.inputs.version }}-${{ github.event.inputs.environment }}
            ${{ secrets.DOCKER_USERNAME }}/frontend:sha-${{ github.sha }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/frontend:latest', secrets.DOCKER_USERNAME) || '' }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/frontend:{1}', secrets.DOCKER_USERNAME, github.event.inputs.version) || '' }}
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            COMMIT_SHA=${{ github.sha }}
  
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.event.inputs.version }}-${{ github.event.inputs.environment }}
            ${{ secrets.DOCKER_USERNAME }}/backend:sha-${{ github.sha }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/backend:latest', secrets.DOCKER_USERNAME) || '' }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/backend:{1}', secrets.DOCKER_USERNAME, github.event.inputs.version) || '' }}
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            COMMIT_SHA=${{ github.sha }}
  
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push database
        uses: docker/build-push-action@v4
        with:
          context: ./database
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/database:${{ github.event.inputs.version }}-${{ github.event.inputs.environment }}
            ${{ secrets.DOCKER_USERNAME }}/database:sha-${{ github.sha }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/database:latest', secrets.DOCKER_USERNAME) || '' }}
            ${{ github.event.inputs.push_latest == 'true' && format('{0}/database:{1}', secrets.DOCKER_USERNAME, github.event.inputs.version) || '' }}
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            COMMIT_SHA=${{ github.sha }}