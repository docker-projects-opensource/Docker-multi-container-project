name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      push_latest:
        description: 'Also push as latest tag'
        required: true
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, database]
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}-${{ github.event.inputs.environment }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.push_latest == 'true' }}
            type=raw,value=latest,enable=${{ github.event.inputs.push_latest == 'true' }}
            type=sha,format=short
      
     
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
            context: ./${{ matrix.service }}
            file: ./${{ matrix.service }}/Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
            cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
            build-args: |
                VERSION=${{ github.event.inputs.version }}
                BUILD_DATE=${{ github.event.repository.updated_at }}
                COMMIT_SHA=${{ github.sha }}



                