name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Select service to build'
        required: true
        type: choice
        options:
        - frontend
        - backend
        - database

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./${{ github.event.inputs.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.sha }}
          
      - name: Image digest
        run: echo "Image has been pushed successfully"